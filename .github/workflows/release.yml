name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Recovery regression checks
        run: dotnet run --project tests/ForgePC.Tests/ForgePC.Tests.csproj -c Release
      - name: Build portable executable
        run: dotnet publish src/ForgePC/ForgePC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts
      - name: Read-only native smoke test and checksum
        shell: pwsh
        run: |
          $result = Start-Process artifacts/EZoptimizer.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Native smoke test failed.' }
          $hash = (Get-FileHash artifacts/EZoptimizer.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  EZoptimizer.exe" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: EZoptimizer-windows-x64
          path: |
            artifacts/EZoptimizer.exe
            artifacts/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EZoptimizer-windows-x64
          path: artifacts
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "$env:GITHUB_REF_NAME" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" artifacts/EZoptimizer.exe artifacts/SHA256SUMS.txt --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" artifacts/EZoptimizer.exe artifacts/SHA256SUMS.txt --verify-tag --title "EZoptimizer $env:GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
